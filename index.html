<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Wisuda, Atin! 🎓</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#FFE9F2;--card:#fff;--ink:#5B1F3F;--soft:#8A4A68;--pink:#FF7FAF;--pink2:#FFB3D1;--mint:#BFF1DE;--butter:#FFE48C;--lav:#DCCBFF;--on:#5B1F3F;--shadow:0 6px 0 rgba(255,127,175,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B1020;--card:#3D1A2E;--ink:#FFE3EF;--soft:#F2B6D0;--shadow:0 6px 0 rgba(255,127,175,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2B1020;--card:#3D1A2E;--ink:#FFE3EF;--soft:#F2B6D0;--shadow:0 6px 0 rgba(255,127,175,.35);color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.55;overflow-x:hidden;
background-image:radial-gradient(var(--pink2) 1.5px,transparent 1.5px);background-size:26px 26px}
h1,h2,h3,.btn{font-family:"Fredoka","Nunito",system-ui,sans-serif;margin:0}
section{max-width:760px;margin:0 auto;padding:56px 20px}
h2{font-size:clamp(26px,6vw,36px);text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--soft);margin:0 0 28px}
.btn{background:var(--pink);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 5px 0 #D94F86;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D94F86}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* gerbang */
#gate{position:fixed;inset:0;z-index:40;background:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;color:#fff;transition:opacity .6s,transform .6s}
#gate.out{opacity:0;transform:scale(1.15);pointer-events:none}
#gate .env{font-size:96px;animation:bob 1.6s ease-in-out infinite}
#gate h1{font-size:clamp(28px,7vw,40px)}
#gate .btn{background:#fff;color:#C2185B;box-shadow:0 5px 0 rgba(0,0,0,.18)}
@keyframes bob{50%{transform:translateY(-14px) rotate(-6deg)}}

/* hero */
.hero{text-align:center;padding-top:40px}
.cap{font-size:104px;display:inline-block;line-height:1;cursor:pointer;user-select:none}
.cap.toss{animation:toss .9s cubic-bezier(.3,.7,.4,1)}
@keyframes toss{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-150px) rotate(300deg)}100%{transform:translateY(0) rotate(720deg)}}
.hero h1{font-size:clamp(34px,9vw,56px);line-height:1.1;margin:10px 0}
.name{display:inline-block;background:var(--butter);color:var(--on);border-radius:22px;padding:6px 20px;font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(22px,6vw,34px);transform:rotate(-2deg);box-shadow:var(--shadow)}
.hero p{max-width:520px;margin:20px auto 22px}
.count{margin-top:14px;color:var(--soft);font-weight:800}

/* polaroid */
.polas{display:grid;justify-content:center;grid-template-columns:repeat(auto-fit,minmax(200px,300px));gap:26px 18px}
.pola{background:#fff;color:var(--on);padding:12px 12px 14px;border-radius:6px;box-shadow:var(--shadow);transform:rotate(var(--r));cursor:pointer;transition:transform .2s}
.pola:hover,.pola.wig{transform:rotate(0) scale(1.05)}
.pola .ph{aspect-ratio:4/5;border-radius:4px;overflow:hidden;display:grid;place-items:center;font-size:54px;text-align:center}
.pola img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.pola figcaption{font-family:"Fredoka",sans-serif;text-align:center;margin-top:10px;font-size:17px}
.pola:nth-child(4n+1) .ph{background:var(--mint)}.pola:nth-child(4n+2) .ph{background:var(--lav)}.pola:nth-child(4n+3) .ph{background:var(--butter)}.pola:nth-child(4n) .ph{background:var(--pink2)}

/* kartu balik */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.flip{perspective:900px;height:210px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);color:var(--on)}
.face h3{font-size:24px}
.face.b{transform:rotateY(180deg);background:#fff;font-size:16px}
.flip:nth-child(1) .f{background:var(--mint)}.flip:nth-child(2) .f{background:var(--lav)}.flip:nth-child(3) .f{background:var(--butter)}
.face .e{font-size:44px}

/* kado */
.gifts{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.gift{width:min(100%,220px);background:var(--card);border:3px dashed var(--pink);border-radius:24px;padding:18px;text-align:center;cursor:pointer;font:inherit;color:inherit;min-height:170px}
.gift .e{font-size:58px;display:block}
.gift.open{border-style:solid;background:var(--pink2);color:var(--on)}
.gift.open .e{animation:pop .5s}
.ajak{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.mini{font-family:"Fredoka",sans-serif;font-size:15px;font-weight:600;border:0;border-radius:999px;padding:8px 16px;background:var(--pink);color:#fff;cursor:pointer}
.mini.alt{background:#fff;color:var(--on)}
.note{margin-top:10px;font-size:14px;font-weight:800}
.remind{background:var(--butter);color:var(--on);border-radius:24px;padding:22px;box-shadow:var(--shadow);text-align:center}
.remind label{display:inline-flex;gap:10px;align-items:center;margin-top:12px;font-weight:800;cursor:pointer}
.remind input{width:22px;height:22px;accent-color:#FF7FAF}
@keyframes pop{50%{transform:scale(1.5) rotate(10deg)}}

/* surat */
.letter{background:var(--card);border-radius:28px;padding:32px 26px;box-shadow:var(--shadow);border:3px solid var(--pink2);text-align:center}
.letter p{max-width:520px;margin:0 auto 14px}
.sign{font-family:"Fredoka",sans-serif;font-size:22px;color:var(--pink)}
.end{text-align:center;padding:10px 20px 70px;color:var(--soft);font-size:15px}
.end .btn{margin-bottom:14px}
.hide{display:none!important}
#emailBox{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(100%,340px)}
#emailBox label{font-family:"Fredoka",sans-serif;font-size:20px}
#emailBox input{width:100%;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-size:17px;text-align:center;color:#5B1F3F;background:#fff}
#emailMsg{min-height:24px;font-weight:800}
.musik{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;padding:10px 16px;background:var(--pink);color:#fff;font-family:"Fredoka",sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 #D94F86}
#pop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(91,31,63,.55);backdrop-filter:blur(4px)}
#pop .box{background:var(--card);color:var(--ink);border-radius:28px;padding:26px 22px;width:min(100%,380px);text-align:center;box-shadow:0 8px 0 rgba(255,127,175,.55);animation:popin .45s cubic-bezier(.3,1.5,.5,1)}
#pop h3{font-size:24px;margin-bottom:6px}
#pop .big{font-size:56px;display:block}
#pop img{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;margin:0 0 14px;display:block;animation:popin .5s}
#pop .tap{margin-top:14px}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.link{background:none;border:0;color:var(--soft);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<button class="musik hide" id="musik" type="button"></button>

<div id="gate">
  <div class="env" aria-hidden="true">🎀</div>
  <h1>Ada ucapan kecil<br>buat <span id="gName"></span></h1>
  <button class="btn" id="openBtn">Buka ucapannya</button>
  <form id="emailBox" class="hide" novalidate>
    <label for="emailIn">Masukkan emailmu dulu ya</label>
    <input id="emailIn" type="email" inputmode="email" autocomplete="email" placeholder="nama@gmail.com" required>
    <button class="btn" type="submit">Masuk</button>
    <div id="emailMsg" role="alert"></div>
  </form>
</div>

<main id="main" class="hide">
  <section class="hero">
    <div class="cap" id="cap" role="img" aria-label="Topi toga, ketuk untuk melempar">🎓</div>
    <h1>Selamat wisuda!</h1>
    <div class="name" id="fullName"></div>
    <p id="heroText"></p>
    <button class="btn" id="tossBtn">Lempar topi togaaa!</button>
    <div class="count" id="count"></div>
  </section>

  <section>
    <h2>Hari yang dinanti 📸</h2>
    <p class="sub">Ketuk fotonya.</p>
    <div class="polas" id="polas"></div>
  </section>

  <section>
    <h2>Fakta penting hari ini</h2>
    <p class="sub">Ketuk kartunya buat dibalik.</p>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>Kado kecil 🎁</h2>
    <p class="sub">Pilih satu, atau buka semuanya.</p>
    <div class="gifts" id="gifts"></div>
  </section>

  <section>
    <div class="remind">
      <h2 style="margin-bottom:8px">Pengingat kecil ⏰</h2>
      <p id="remindText" style="margin:0"></p>
      <label><input type="checkbox" id="remindChk"> Sudah beres</label>
      <div id="remindOk" class="hide" style="margin-top:8px;font-weight:800">Mantap! 🎉</div>
    </div>
  </section>

  <section>
    <div class="letter">
      <h2 style="margin-bottom:16px">Sedikit pesan</h2>
      <div id="letter"></div>
      <div class="sign" id="sign"></div>
    </div>
  </section>

  <div class="end">
    <button class="link" id="fotoLagi" type="button">📷 Lihat foto tadi lagi</button><br>
    <button class="btn hide" id="waBtn">Balas ucapannya</button>
    <div>Dibuat dengan niat baik dan sedikit begadang.</div>
  </div>
</main>

<div id="pop" class="hide" role="dialog" aria-modal="true" aria-labelledby="popTitle">
  <div class="box">
    <div id="popClosed">
      <span class="big" aria-hidden="true">💭</span>
      <h3 id="popTitle"></h3>
      <button class="btn tap" id="popOpen" type="button">Tap to open the photo</button>
    </div>
    <div id="popOpenView" class="hide">
      <img id="popImg" alt="">
      <button class="btn" id="popClose" type="button">Close</button>
    </div>
  </div>
</div>

/* konfeti */
const cv = $("confetti"), cx = cv.getContext("2d"); let ps = [], run = false;
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener("resize", size); size();
const cols = ["#FF7FAF", "#FFB3D1", "#BFF1DE", "#FFE48C", "#DCCBFF", "#fff"];
function burst(x, y, n) {
  n = reduce ? 8 : n;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 8;
    ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, r: 4 + Math.random() * 5, c: cols[i % cols.length], rot: Math.random() * 6, life: 90 + Math.random() * 40 }); }
  if (!run) { run = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  ps = ps.filter(p => p.life > 0);
  ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .28; p.vx *= .985; p.rot += .15; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life / 30); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
  if (ps.length) requestAnimationFrame(tick); else run = false;
}

let n = 0;
function toss() {
  const c = $("cap"); c.classList.remove("toss"); void c.offsetWidth; c.classList.add("toss");
  n++; const r = c.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 50);
  $("count").textContent = n === 1 ? "Topi dilempar 1 kali. Lagi dong!" : n < 5 ? "Topi dilempar " + n + " kali 🎉" : "Topi dilempar " + n + " kali. Topinya mulai pusing 😵‍💫";
}
$("tossBtn").onclick = toss; $("cap").onclick = toss;
/* gerbang email */
function normEmail(v) {
  v = v.trim().toLowerCase(); const p = v.split("@");
  if (p.length !== 2) return v;
  return (p[1] === "gmail.com" || p[1] === "googlemail.com") ? p[0].split("+")[0].replace(/\./g, "") + "@gmail.com" : v;
}
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}

/* musik */
const audio = CONFIG.lagu && CONFIG.lagu.src ? Object.assign(new Audio(CONFIG.lagu.src), { loop: true }) : null;
const mb = $("musik");
function musikUI() { mb.textContent = audio ? (audio.paused ? "🎵 Putar lagu" : "🔇 Jeda lagu") : ""; }
mb.onclick = () => { if (audio) { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); } };
if (audio) { audio.onplay = musikUI; audio.onpause = musikUI; }
musikUI();

const pop = $("pop");
$("popTitle").textContent = CONFIG.fotoLama.pesan;
$("popImg").src = CONFIG.fotoLama.src; $("popImg").alt = "Our first meeting";
function bukaPop(isi) {
  $("popClosed").classList.toggle("hide", isi); $("popOpenView").classList.toggle("hide", !isi);
  pop.classList.remove("hide"); (isi ? $("popClose") : $("popOpen")).focus();
}
$("popOpen").onclick = () => { bukaPop(true); burst(innerWidth / 2, innerHeight / 3, 40); };
$("popClose").onclick = () => pop.classList.add("hide");
pop.onclick = ev => { if (ev.target === pop) pop.classList.add("hide"); };
$("fotoLagi").onclick = () => bukaPop(true);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") pop.classList.add("hide"); });

function masuk() {
  $("main").classList.remove("hide"); if (audio) mb.classList.remove("hide");
  $("gate").classList.add("out");
  setTimeout(() => burst(innerWidth / 2, innerHeight / 3, 50), 250);
  setTimeout(() => $("gate").classList.add("hide"), 700);
  if (audio) audio.play().catch(() => {});
  setTimeout(() => bukaPop(false), 1800);
}
$("openBtn").onclick = () => { $("openBtn").classList.add("hide"); $("emailBox").classList.remove("hide"); $("emailIn").focus(); };
$("emailBox").onsubmit = async ev => {
  ev.preventDefault(); const msg = $("emailMsg"); msg.textContent = "";
  try {
    const h = await sha("wisuda-atin|" + normEmail($("emailIn").value));
    if (h === CONFIG.emailIzin) masuk(); else msg.textContent = "Hmm, email ini belum terdaftar buat ucapan ini 🙈";
  } catch (e) { msg.textContent = "Browsernya belum bisa memeriksa email. Coba buka lewat Chrome atau Safari ya."; }
};
